<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort and Filter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="jobs-page-layout">
    <aside id="filters-sidebar">
        <button type="button">←DevJobs</button>
        <h2>Filter</h2>
    <div class="filter-group">
        <h3>Category</h3>
        <label class="filter-option">
            <input type="checkbox" name="category" value="frontend">
            Frontend
        </label>
        <label class="filter-option">
            <input type="checkbox" name="category" value="backend">
            Backend
        </label>
        <label class="filter-option">
            <input type="checkbox" name="category" value="mobile">
            Mobile
        </label>
        <label class="filter-option">
            <input type="checkbox" name="category" value="devops">
            DevOps
        </label>
    </div>
     
    <div class="filter-group">
        <h3>Location</h3>
        <select id="location-filter">
            <option value="all locations">All Locations</option>
            <option value="bangalore">Bangalore</option>
            <option value="mumbai">Mumbai</option>
            <option value="delhi">Delhi</option>
            <option value="remote">Remote</option>
        </select>
    </div>

    <div class="filter-group">
        <h3>Experience</h3>
        <label class="filter-option">
            <input type="checkbox" name="experience" value="0-1">
            0 - 1 Yrs
        </label>
        <label class="filter-option">
            <input type="checkbox" name="experience" value="1-3">
            1 - 3 Yrs
        </label>
        <label class="filter-option">
            <input type="checkbox" name="experience" value="3-5">
            3 - 5 Yrs
        </label>
        <label class="filter-option">
            <input type="checkbox" name="experience" value="5+">
            5+ Yrs
        </label>
    </div>

    <div class="filter-group">
        <h3>Salary (LPA)</h3>
        <label class="filter-option">
            <input type="checkbox" name="salary" value="0-5">
            0 - 5 LPA
        </label>
        <label class="filter-option">
            <input type="checkbox" name="salary" value="5-10">
            5 - 10 LPA
        </label>
        <label class="filter-option">
            <input type="checkbox" name="salary" value="10-15">
            10 - 15 LPA
        </label>
        <label class="filter-option">
            <input type="checkbox" name="salary" value="15+">
            15+ LPA
        </label>
    </div>

    <div class="filter-group">
        <h3>Job Type</h3>
        <label class="filter-option">
            <input type="checkbox" name="job-type" value="full-time">
            Full-time
        </label>
        <label class="filter-option">
            <input type="checkbox" name="job-type" value="part-time">
            Part-time
        </label>
        <label class="filter-option">
            <input type="checkbox" name="job-type" value="contract">
            Contract
        </label>
        <label class="filter-option">
            <input type="checkbox" name="job-type" value="internship">
            Internship
        </label>
    </div>

    <div class="filter-group">
        <h3>Work Mode</h3>
        <label class="filter-option">
            <input type="radio" name="work-mode" value="remote">
            Remote
        </label>
        <label class="filter-option">
            <input type="radio" name="work-mode" value="hybrid">
            Hybrid
        </label>
        <label class="filter-option">
            <input type="radio" name="work-mode" value="onsite">
            Onsite
        </label>
        <label class="filter-option">
            <input type="radio" name="work-mode" value="all" checked>
            All
        </label>
    </div>
    </aside>

<main class="jobs-content-area">
    <div class="results-header">
        <p>Showing <strong id="job-count">124</strong> Jobs</p>
        <div id="all-filters">
        <button id="bookmark" type="button">BookMark Jobs</button>
        <button id="applybtn" type="button">Apply</button>
        <button id="clearbtn" type="button">Clear</button>
        <div class="sort-container">
            <label for="job-sort">Sort by:</label>
            <select id="job-sort">
                <option value="latest">Latest</option>
                <option value="salary-desc">Salary: High to Low</option>
                <option value="salary-asc">Salary: Low to High</option>
                <option value="alphabetical">Alphabetical</option>
            </select>
        </div>
        </div>
    </div>
    
    <div class="job-cards-container">
        
    <div class="job-card" data-category="frontend" data-location="bangalore" data-experience="3-5" data-salary="12-18" data-type="full-time">
    <!-- Wrap the top elements into a header for alignment, keeping your exact items -->
    <div class="card-header">
        <div class="company-logo">💼</div> <!-- 1. The clean placeholder box -->
        <div class="top-details">
            <h3 class="role">Senior Frontend Developer</h3>
            <span class="company-name">TechCorp Solutions</span>
        </div>
        <button type="button" aria-label="Save job" class="bookmark-btn">
            <i class="fa-regular fa-bookmark fa-2x"></i>
        </button>
    </div>

    <!-- Keeping your exact details layout entirely untouched -->
    <div class="details">
        <div class="left-details">
            <span class="location">📍 Bangalore, India</span>
            <span class="experience">💼 3-5 Yrs</span>
            <span class="mode">🏠 Remote</span>
        </div>
        <div class="right-details">
            <span class="salary">₹12 - 18 LPA</span>
        </div>
    </div>

    <ul class="skills">
        <li>React</li>
        <li>TypeScript</li>
        <li>Tailwind</li>
    </ul>

    <div class="card-actions">
        <button type="button" class="btn-save">Save</button>
        <button type="button" class="btn-details">Job Details</button>
    </div>
</div>           
</div>

<div id="loading-spinner" class="step-hidden">
    Loading jobs...
</div>

<div class="pagination" id="pagination">
    <button type="button" id="prev-page">← Prev</button>
    <span id="page-numbers">
        <button type="button" class="page-btn active">1</button>
        <button type="button" class="page-btn">2</button>
        <button type="button" class="page-btn">3</button>
        <button type="button" class="page-btn">4</button>
        <button type="button" class="page-btn">5</button>
        <button type="button" class="page-btn">6</button>
        <button type="button" class="page-btn">7</button>
        <button type="button" class="page-btn">8</button>
        <button type="button" class="page-btn">9</button>
        <button type="button" class="page-btn">10</button>
        <button type="button" class="page-btn">11</button>
        <button type="button" class="page-btn">12</button>
        <button type="button" class="page-btn">13</button>
    </span>
    <button type="button" id="next-page">Next →</button>
</div>

</main>
</div>
<script src="jobsdata.js"></script>
<script src="render.js"></script>
<script src="filter.js"></script>
</body>
</html>
